name: campusphere-ictu

services:
  app:
    container_name: campusphere-app
    image: campusphere:${IMAGE_TAG:-ictu}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: "1"
      SESSION_STORE: supabase
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in the protected ICTU environment file}"
      SESSION_SECRET_PREVIOUS: "${SESSION_SECRET_PREVIOUS:-}"
      SESSION_COOKIE_MAX_AGE_MS: "${SESSION_COOKIE_MAX_AGE_MS:-86400000}"
      AUTH_DATA_SOURCE: supabase
      CONTENT_DATA_SOURCE: supabase
      BUILDING_DATA_SOURCE: supabase
      ROUTE_DATA_SOURCE: supabase
      VR_DATA_SOURCE: supabase
      SCHEDULE_DATA_SOURCE: supabase
      MAP_RENDERER: maplibre
      SUPABASE_URL: "${SUPABASE_URL:?set SUPABASE_URL in the protected ICTU environment file}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY in the protected ICTU environment file}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in the protected ICTU environment file}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in the protected ICTU environment file}"
      GOOGLE_REDIRECT_URI: "https://campusphere.cspc.edu.ph/auth/callback"
      OFFLINE_MAP_RELEASE_MODE: "${OFFLINE_MAP_RELEASE_MODE:-drive}"
      OFFLINE_MAP_MANIFEST_URL: "${OFFLINE_MAP_MANIFEST_URL:?set OFFLINE_MAP_MANIFEST_URL in the protected ICTU environment file}"
      OFFLINE_MAP_SIGNING_PUBLIC_KEY: "${OFFLINE_MAP_SIGNING_PUBLIC_KEY:?set OFFLINE_MAP_SIGNING_PUBLIC_KEY in the protected ICTU environment file}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
